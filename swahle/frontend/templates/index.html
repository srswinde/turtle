<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cassini · Swahle</title>
  <style>
    :root {
      --bg:#f6f7f9; --fg:#1e2430; --muted:#667085;
      --card:#ffffff; --border:#e6e8ec; --accent:#2f7d4f; --accent-fg:#fff;
      --good:#0ca30c; --spark-ambient:#eb6834; --spark-underground:#2a78d6;
      --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
      --skeleton:#e9ebef;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f141a; --fg:#e6eaf0; --muted:#93a0b4;
        --card:#171d25; --border:#262e39; --accent:#3fae6b; --accent-fg:#06110a;
        --good:#0ca30c; --spark-ambient:#d95926; --spark-underground:#3987e5;
        --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
        --skeleton:#1f2731;
      }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    a { color:inherit; }
    .site { position:sticky; top:0; z-index:5; display:flex; align-items:center;
      justify-content:space-between; padding:.85rem 1.25rem;
      background:color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter:blur(8px); border-bottom:1px solid var(--border); }
    .brand { font-weight:800; text-decoration:none; letter-spacing:-.02em; font-size:1.1rem; }
    .site nav { display:flex; gap:.5rem; align-items:center; }
    .site nav a { text-decoration:none; font-weight:600; font-size:.9rem;
      padding:.5rem .9rem; border-radius:999px; }
    .site nav a.signin { background:var(--accent); color:var(--accent-fg); }
    .wrap { max-width:1040px; margin:0 auto; padding:1.5rem 1.25rem 4rem; }

    /* Hero */
    .hero { position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--border);
      box-shadow:var(--shadow); background:#000; aspect-ratio:16/10; }
    .hero img { display:block; width:100%; height:100%; object-fit:cover; }
    .hero .overlay { position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 45%); }
    .badges { position:absolute; top:.85rem; left:.85rem; display:flex; gap:.5rem; }
    .live-badge { display:inline-flex; align-items:center; gap:.4rem; font-weight:700;
      font-size:.72rem; letter-spacing:.06em; color:#fff; background:rgba(0,0,0,.45);
      padding:.35rem .6rem; border-radius:999px; }
    .live-badge .dot { width:8px; height:8px; border-radius:50%; background:#ff4d4f;
      box-shadow:0 0 0 0 rgba(255,77,79,.7); animation:pulse 1.8s infinite; }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,77,79,.6)} 70%{box-shadow:0 0 0 8px rgba(255,77,79,0)} 100%{box-shadow:0 0 0 0 rgba(255,77,79,0)} }
    .chip { display:none; align-items:center; gap:.35rem; font-weight:700; font-size:.75rem;
      color:#06110a; background:#3fae6b; padding:.35rem .6rem; border-radius:999px; }
    .hero-caption { position:absolute; left:1rem; bottom:.9rem; color:#fff; }
    .hero-caption h1 { margin:0; font-size:1.4rem; letter-spacing:-.02em; }
    .hero-caption p { margin:.15rem 0 0; font-size:.82rem; opacity:.85; }

    /* Tiles */
    .tiles { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1rem; }
    .tile { background:var(--card); border:1px solid var(--border); border-radius:14px;
      padding:1rem 1.1rem; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:.4rem; }
    .tile .label { font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
    .tile .row { display:flex; align-items:flex-end; justify-content:space-between; gap:.75rem; }
    .tile .val { font-size:2rem; font-weight:750; line-height:1; letter-spacing:-.02em; }
    .tile .unit { font-size:.95rem; color:var(--muted); font-weight:600; margin-left:.15rem; }
    .spark-wrap { min-width:110px; }
    .spark { width:120px; height:36px; display:block; }

    /* Week */
    .section-title { display:flex; align-items:baseline; justify-content:space-between; margin:2.25rem 0 .9rem; }
    .section-title h2 { margin:0; font-size:1.25rem; letter-spacing:-.01em; }
    .section-title a { color:var(--muted); text-decoration:none; font-size:.85rem; font-weight:600; }
    .week { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.9rem; }
    .day { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden;
      text-decoration:none; color:inherit; box-shadow:var(--shadow); transition:transform .12s ease, border-color .12s ease; }
    .day:hover { transform:translateY(-3px); border-color:var(--accent); }
    .day .thumb { aspect-ratio:4/3; background:var(--skeleton); position:relative; overflow:hidden; }
    .day .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .day .thumb.empty { display:flex; align-items:center; justify-content:center; font-size:1.6rem; opacity:.5; }
    .day .meta { padding:.6rem .75rem .75rem; }
    .day .name { font-weight:700; font-size:.95rem; }
    .badge { display:inline-block; margin-top:.35rem; font-size:.75rem; font-weight:700;
      padding:.2rem .55rem; border-radius:999px; }
    .badge.hit { background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--good); }
    .badge.none { background:color-mix(in srgb, var(--muted) 16%, transparent); color:var(--muted); }
    @media (max-width:560px){ .hero{ aspect-ratio:4/3; } .hero-caption h1{ font-size:1.15rem; } }
  </style>
</head>
<body>
  <header class="site">
    <a class="brand" href="/">🐢 Swahle</a>
    <nav>
      <a href="/detections">Detections</a>
      <a class="signin" href="/app">🔒 Sign in</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero">
      <img id="live" alt="Latest hole-cam frame">
      <div class="overlay"></div>
      <div class="badges">
        <span class="live-badge"><span class="dot"></span> LIVE</span>
        <span class="chip" id="confidence"></span>
      </div>
      <div class="hero-caption">
        <h1>Cassini, right now</h1>
        <p id="live-ts">connecting…</p>
      </div>
    </section>

    <div class="tiles">
      <div class="tile" id="tile-ambient">
        <span class="label">Ambient</span>
        <div class="row">
          <div><span class="val">—</span><span class="unit">°F</span></div>
          <div class="spark-wrap"></div>
        </div>
      </div>
      <div class="tile" id="tile-underground">
        <span class="label">Underground</span>
        <div class="row">
          <div><span class="val">—</span><span class="unit">°F</span></div>
          <div class="spark-wrap"></div>
        </div>
      </div>
    </div>

    <div class="section-title">
      <h2>Cassini's week</h2>
      <a href="/detections">All detections →</a>
    </div>
    <div class="week" id="week"></div>
  </main>

  <script>
    const LIVE_MS = 5000, TEMP_MS = 60000;
    const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

    async function post(url, body) {
      const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(body || {}) });
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }
    const lastKey = (o) => { const k = Object.keys(o||{}); if (!k.length) return null;
      k.sort((a,b)=>Number(a)-Number(b)); return k[k.length-1]; };

    async function updateLive() {
      try {
        const data = await post('/api/hole-cam/latest', {});
        const k = lastKey(data.path);
        if (k) {
          document.getElementById('live').src = data.path[k];
          const prob = (data.prob || {})[k];
          const chip = document.getElementById('confidence');
          if (prob != null && prob > 0.6) { chip.textContent = '🐢 ' + Math.round(prob*100) + '%'; chip.style.display='inline-flex'; }
          else chip.style.display = 'none';
          document.getElementById('live-ts').textContent = 'updated ' + new Date().toLocaleTimeString();
        }
      } catch (e) { /* keep last frame */ }
      setTimeout(updateLive, LIVE_MS);
    }

    function sparkline(values, color, w=120, h=36) {
      if (values.length < 2) return '';
      const min = Math.min(...values), max = Math.max(...values), rng = (max-min) || 1, pad = 4;
      const iw = w - pad*2, ih = h - pad*2;
      const pts = values.map((v,i) => [pad + iw*(i/(values.length-1)), pad + ih*(1-(v-min)/rng)]);
      const d = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      const last = pts[pts.length-1];
      return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">' +
        '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3" fill="'+color+'"/></svg>';
    }
    function renderTile(name, series, color) {
      const tile = document.getElementById('tile-'+name); if (!tile) return;
      if (!series || !series.temp) { tile.querySelector('.val').textContent = '—'; return; }
      const temps = Object.keys(series.temp).sort((a,b)=>Number(a)-Number(b)).map(k=>series.temp[k]);
      if (!temps.length) return;
      tile.querySelector('.val').textContent = temps[temps.length-1].toFixed(1);
      tile.querySelector('.spark-wrap').innerHTML = sparkline(temps, color);
    }
    async function updateTemps() {
      try {
        const data = await post('/api/temperatures', { timestamp: new Date().toISOString() });
        renderTile('ambient', data.ambient, css('--spark-ambient'));
        renderTile('underground', data.underground, css('--spark-underground'));
      } catch (e) {}
      setTimeout(updateTemps, TEMP_MS);
    }

    function headlineUrl(data) {
      let best = -1, url = null;
      for (const g in data) { const p = data[g].prob || [];
        for (let i=0;i<p.length;i++) if (p[i] > best) { best = p[i]; url = data[g].url[i]; } }
      return url;
    }
    async function loadWeek() {
      const week = document.getElementById('week'), now = new Date();
      for (let i=0;i<7;i++) {
        const date = new Date(now - i*86400000);
        const label = i===0 ? 'Today' : date.toLocaleDateString('en-US',{weekday:'long'});
        const card = document.createElement('a');
        card.className = 'day';
        card.innerHTML = '<div class="thumb"></div><div class="meta"><div class="name">'+label+'</div>' +
          '<span class="badge none">…</span></div>';
        week.appendChild(card);
        try {
          const data = await post('/api/detections', { date: date.toDateString() });
          const n = Object.keys(data).length;
          const thumb = card.querySelector('.thumb'), badge = card.querySelector('.badge');
          if (n === 0) {
            thumb.classList.add('empty'); thumb.textContent = '🐢💤';
            badge.className = 'badge none'; badge.textContent = 'No activity';
          } else {
            const url = headlineUrl(data);
            if (url) { const img = document.createElement('img'); img.loading='lazy'; img.src = url; thumb.appendChild(img); }
            else { thumb.classList.add('empty'); thumb.textContent='🐢'; }
            badge.className = 'badge hit'; badge.textContent = n + (n===1 ? ' sighting' : ' sightings');
            card.href = '/detections?date=' + encodeURIComponent(date.toDateString());
          }
        } catch (e) {
          const thumb = card.querySelector('.thumb'), badge = card.querySelector('.badge');
          thumb.classList.add('empty'); thumb.textContent = '🐢💤';
          badge.className = 'badge none'; badge.textContent = 'No activity';
        }
      }
    }

    updateLive(); updateTemps(); loadWeek();
  </script>
  <script src="/static/session-guard.js" defer></script>
</body>
</html>
